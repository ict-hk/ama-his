<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS -->

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #f8fafc;
        }

        .font-chalk {
            font-family: 'Kosugi Maru', cursive;
        }

        .font-traditional {
            font-family: 'Yuji Syuku', serif;
        }

        /* モダン黒板デザイン */
        .blackboard {
            background: linear-gradient(135deg, #1e3e2b 0%, #11271b 100%);
            border: 8px solid #8b5cf6;
            border-image: linear-gradient(to bottom right, #3b82f6, #8b5cf6) 1;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
        }

        /* チョーク風テキスト */
        .chalk-text {
            color: #f8fafc;
            text-shadow: 0 0 2px rgba(255,255,255,0.4);
        }

        .chalk-yellow {
            color: #fef08a;
            text-shadow: 0 0 2px rgba(254,240,138,0.4);
        }

        .chalk-red {
            color: #fca5a5;
        }

        .chalk-blue {
            color: #38bdf8;
            text-shadow: 0 0 4px rgba(56,189,248,0.5);
        }

        /* ふわふわ浮遊アニメーション */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between selection:bg-indigo-100">

    <!-- ヘッダー -->
    <header class="bg-indigo-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="bg-indigo-700/80 text-amber-300 p-2 rounded-xl text-lg flex items-center justify-center w-10 h-10 shadow-inner">
                    <i class="fa-solid fa-landmark-dome"></i>
                </span>
                <div>
                    <h1 class="font-bold text-base sm:text-lg tracking-wide leading-tight">天草・島原の乱後の復興に尽くした人</h1>
                    <p class="text-xs text-indigo-200">〜鈴木三公・鈴木重成公〜</p>

    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-5xl mx-auto w-full px-3 sm:px-4 py-4 flex-grow flex flex-col justify-center">
        

        <!-- 学習ステージ -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-stretch">
            
            <!-- 黒板エリア (8列) -->
            <div class="lg:col-span-8 flex flex-col">

                    <!-- 日付表示風アクセント -->
                    <div class="absolute top-4 right-5 font-chalk text-emerald-200/50 text-xs sm:text-sm tracking-widest flex items-center gap-1">
                        <span>〇月×日</span>
                    </div>

                    <!-- メインテキスト表示 -->
                    <div id="blackboardContent" class="flex-grow flex flex-col items-center justify-center text-center py-2">
                        <!-- JSで動的挿入 -->
                    </div>

                    <!-- 黒板下部フッター -->
                    <div class="mt-2 pt-2 border-t border-emerald-800/60 flex justify-between items-center text-xs text-emerald-300/80 font-chalk">
                        <span><i class="fa-solid fa-chalkboard mr-1.5"></i>天草歴史Web教材</span>
                        <span id="chalkNotice">解説画面</span>
                    </div>
                </div>
            </div>

            <!-- キャラクター表示エリア (4列) -->

                    <!-- 武士キャラクター (SVG) -->
                    <div id="samuraiAvatar" class="w-40 h-44 sm:w-48 sm:h-52 relative animate-float flex items-center justify-center">
                        <!-- JSで動的挿入 -->
                    </div>

                    <!-- キャラクターラベル -->
                    <div id="poseBadge" class="mt-3 bg-indigo-900 text-white text-xs font-bold px-4 py-1.5 rounded-full shadow-sm">
                        【 鈴木重成 】
                    </div>
                </div>
            </div>
        </div>

        <!-- セリフ・ダイアログ ＆ ナビゲーション -->
        <div class="mt-4 bg-white border border-slate-200 rounded-2xl p-4 sm:p-6 shadow-md relative">
            <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-100">
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 rounded-full bg-indigo-600 inline-block shadow-sm"></span>
                    <span class="font-bold text-indigo-950 text-base sm:text-lg font-traditional tracking-wide">【 鈴木重成 】</span>
                </div>
                <div id="modeStatus" class="text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full border border-indigo-100">
                    導入パート
                </div>
            </div>

            <!-- 台詞テキスト -->
            <div class="min-h-[60px] sm:min-h-[70px] flex items-center px-1">
                <p id="narrationText" class="text-slate-800 text-base sm:text-lg font-bold leading-relaxed">
                    <!-- JSで動的挿入 -->
                </p>
            </div>

            <!-- 操作ボタン -->
            <div class="mt-4 flex items-center justify-between pt-3 border-t border-slate-100">
                <button id="prevBtn" onclick="prevSlide()" class="px-5 py-2.5 rounded-xl text-sm font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 transition disabled:opacity-30 disabled:cursor-not-allowed flex items-center space-x-2">

                    <span>前へ</span>

                <button id="nextBtn" onclick="nextSlide()" class="px-6 py-2.5 rounded-xl text-sm font-bold bg-indigo-600 hover:bg-indigo-700 text-white transition shadow-md hover:shadow-indigo-200 flex items-center space-x-2">
                    <span>次へ進む</span>
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
        </div>

    </main>

    <!-- フッター (全クレジット対応) -->
    <footer id="mainFooter" class="bg-slate-900 text-slate-400 text-xs py-3 text-center mt-6">
        <div class="max-w-5xl mx-auto px-4 flex flex-wrap justify-center items-center gap-x-4 gap-y-1">
            <span>制作：RKK熊本放送</span>
            <span>企画：マックスファイブ</span>
            <span>協力：OA通信サービス, アイエムエス・ドット・ジェーピー, ジェイムーブ</span>
        </div>

    <!-- スクリプト -->
    <script>
        // --- 武士（鈴木重成公）のSVG生成 ---
        function getSamuraiSVG(pose) {
            const kimono = "#1e3a8a"; // 藍色
            const haori = "#1e40af"; 
            const hakama = "#38bdf8"; // 水色
            const skin = "#fdedc9";

            let armsSVG = "";
            let itemSVG = "";
            
            // 正解・嬉しい時の判定フラグ
            const isHappy = (pose === 'happy' || pose === 'correct' || pose === 'win');

            if (isHappy || pose === 'pointing') {
                // 正解（手を高く上げて喜ぶポーズ）
                armsSVG = `
                    <path d="M 35 110 Q 20 80 15 50" fill="none" stroke="${kimono}" stroke-width="14" stroke-linecap="round"/>
                    <circle cx="15" cy="45" r="7" fill="${skin}"/>
                    <path d="M 80 110 Q 85 125 90 125" fill="none" stroke="${kimono}" stroke-width="12" stroke-linecap="round"/>
                    <circle cx="90" cy="125" r="6" fill="${skin}"/>
                `;
            } else if (pose === 'greeting') {
                armsSVG = `<path d="M 35 110 Q 50 125 65 125 Q 80 125 95 110" fill="none" stroke="${kimono}" stroke-width="14" stroke-linecap="round"/>`;
            } else if (pose === 'book') {
                armsSVG = `
                    <path d="M 35 110 Q 45 100 55 105" fill="none" stroke="${kimono}" stroke-width="12" stroke-linecap="round"/>
                    <path d="M 80 110 Q 70 100 60 105" fill="none" stroke="${kimono}" stroke-width="12" stroke-linecap="round"/>
                `;
                itemSVG = `
                    <rect x="45" y="90" width="26" height="32" rx="2" fill="#fff8dc" stroke="#8b4513" stroke-width="2" transform="rotate(-5, 58, 106)"/>
                    <line x1="58" y1="91" x2="58" y2="121" stroke="#8b4513" stroke-width="1.5" transform="rotate(-5, 58, 106)"/>
                `;
            } else {
                armsSVG = `
                    <path d="M 35 110 Q 25 125 35 135" fill="none" stroke="${kimono}" stroke-width="12" stroke-linecap="round"/>
                    <path d="M 80 110 Q 90 125 80 135" fill="none" stroke="${kimono}" stroke-width="12" stroke-linecap="round"/>
                `;
            }

            // 表情（正解の時はにっこり口・笑い目にする）
            const eyeSVG = isHappy ? `
                <path d="M 52 53 Q 56 47 60 53" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M 70 53 Q 74 47 78 53" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
            ` : `
                <ellipse cx="56" cy="53" rx="2.5" ry="3.5" fill="#333" />
                <ellipse cx="74" cy="53" rx="2.5" ry="3.5" fill="#333" />
            `;

            const mouthSVG = isHappy ? `
                <path d="M 56 65 Q 65 74 74 65 Z" fill="#b91c1c" />
            ` : `
                <path d="M 58 66 Q 65 72 72 66" fill="none" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round"/>
            `;

            return `
                <svg viewBox="0 0 130 160" class="w-full h-full drop-shadow-md">
                    <!-- 刀 -->
                    <path d="M 30 115 L 10 135" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                    <path d="M 28 118 L 12 138" stroke="#ccc" stroke-width="2" stroke-linecap="round"/>
                    <path d="M 25 110 L 5 125" stroke="#333" stroke-width="3" stroke-linecap="round"/>

                    <!-- 着物・羽織 -->
                    <path d="M 35 90 L 95 90 L 105 160 L 25 160 Z" fill="${hakama}" />
                    <path d="M 35 90 Q 65 100 95 90 L 100 140 L 30 140 Z" fill="${haori}" />
                    <path d="M 50 90 L 65 120 L 80 90" fill="none" stroke="#fff" stroke-width="3"/>
                    
                    <circle cx="45" cy="105" r="2" fill="#fff"/>
                    <circle cx="85" cy="105" r="2" fill="#fff"/>

                    ${armsSVG}
                    ${itemSVG}

                    <!-- 首・顔 -->
                    <rect x="58" y="75" width="14" height="18" fill="${skin}" />
                    <ellipse cx="65" cy="55" rx="22" ry="26" fill="${skin}" />

                    <!-- 髪 -->
                    <path d="M 50 38 Q 65 30 80 38 Q 80 32 65 30 Q 50 32 50 38 Z" fill="#222" />
                    <rect x="61" y="20" width="8" height="15" rx="3" fill="#222" transform="rotate(15 65 27)"/>
                    <path d="M 62 21 L 68 21" stroke="#DAA520" stroke-width="2"/>

                    <!-- 表情 -->
                    <path d="M 50 45 Q 56 42 60 46" fill="none" stroke="#333" stroke-width="2"/>
                    <path d="M 70 46 Q 74 42 80 45" fill="none" stroke="#333" stroke-width="2"/>
                    ${eyeSVG}
                    <path d="M 65 54 L 63 60 L 67 60" fill="none" stroke="#d97706" stroke-width="1.5"/>
                    ${mouthSVG}
                </svg>
            `;
        }

        // 判定保持フラグ
        let lastSelectedCorrect = null;

        // --- シナリオデータ ---
        const slidesData = [
            // 導入 (1-5)
            {
                id: 1, chapter: "導入", title: "タイトル", pose: "greeting", notice: "タイトル画面",
                blackboardHTML: `
                    <div class="space-y-4 my-auto">
                        <div class="inline-block border border-amber-300/60 bg-amber-400/10 px-4 py-1 rounded-full text-amber-200 text-xs sm:text-sm font-chalk">
                            鈴木重成公没後３５０年記念事業
                        </div>
                        <h2 class="text-2xl sm:text-4xl font-bold chalk-text font-chalk leading-snug">
                            「天草・島原の乱後の復興に尽くした人」
                        </h2>
                        <p class="text-xl sm:text-2xl chalk-yellow font-chalk">〜 鈴木三公 〜</p>
                        <div class="pt-3">
                            <button onclick="nextSlide()" class="px-8 py-3 rounded-full bg-amber-400 hover:bg-amber-300 text-slate-900 font-bold font-chalk text-lg shadow-lg hover:scale-105 transition transform flex items-center justify-center gap-2 mx-auto">
                                <i class="fa-solid fa-play"></i> クイズ START

                speechText: "鈴木重成公没後350年記念 デジタル歴史教材へようこそ！"
            },
            {
                id: 2, chapter: "導入", title: "あいさつ", pose: "greeting", notice: "導入パート",
                blackboardHTML: `<div class="space-y-4 my-auto"><h2 class="text-2xl sm:text-4xl font-bold chalk-text font-chalk">「天草・島原の乱後の復興に尽くした人」</h2><p class="text-xl sm:text-2xl chalk-yellow font-chalk">〜 鈴木三公 〜</p></div>`,
                speechText: "こんにちは！鈴木重成です。"
            },
            {

                speechText: "この「天草・島原の乱後の復興に尽くした人〜鈴木三公〜」では、天草の歴史を振り返りながら、今の天草を考えます。"
            },
            {
                id: 4, chapter: "導入", title: "ご案内", pose: "greeting", notice: "案内",

                speechText: "みなさん、私についてきて下さいね。"
            },
            {
                id: 5, chapter: "導入", title: "進め方", pose: "pointing", notice: "進め方案内",
                blackboardHTML: `<div class="space-y-4 my-auto"><h2 class="text-2xl sm:text-4xl font-bold chalk-text font-chalk">「天草・島原の乱後の復興に尽くした人」</h2><p class="text-xl sm:text-2xl chalk-yellow font-chalk">〜 鈴木三公 〜</p></div>`,
                speechText: "質問ごとに、答えの解説ページがあります。さあ、頑張りましょう！"
            },

            // 第一章タイトル (6-1)
            {
                id: 6, chapter: "第一章", title: "第一章タイトル", pose: "greeting", notice: "第一章スタート",
                blackboardHTML: `
                    <div class="space-y-6 my-auto cursor-pointer" onclick="nextSlide()">
                        <div class="bg-amber-400/20 text-amber-200 border border-amber-400/40 px-6 py-2 rounded-full text-sm sm:text-base font-chalk inline-block">★ 第一章 ★</div>
                        <h2 class="text-3xl sm:text-5xl font-bold chalk-yellow font-chalk leading-tight">キリシタン文化ってなぁ〜に？</h2>
                        <p class="text-lg sm:text-xl chalk-text font-chalk pt-2 animate-pulse">画面をクリックしてね！</p>
                    </div>
                `,
                speechText: "第一章、キリシタン文化ってなぁ〜に？スタートします！"
            },

            // Q1前振り (7-10)
            { id: 7, chapter: "第一章", title: "Q1 前振り 1/4", pose: "pointing", notice: "1. キリシタン文化ってなぁ〜に？", blackboardHTML: `<div class="w-full text-left my-auto px-4"><h3 class="text-2xl sm:text-3xl chalk-yellow font-chalk border-b border-emerald-600 pb-3 mb-4">1. キリシタン文化ってなぁ〜に？</h3></div>`, speechText: "さあ、最初は歴史問題からいくよ。" },
            { id: 8, chapter: "第一章", title: "Q1 前振り 2/4", pose: "pointing", notice: "1. キリシタン文化ってなぁ〜に？", blackboardHTML: `<div class="w-full text-left my-auto px-4"><h3 class="text-2xl sm:text-3xl chalk-yellow font-chalk border-b border-emerald-600 pb-3 mb-4">1. キリシタン文化ってなぁ〜に？</h3></div>`, speechText: "江戸時代になる前、日本にキリスト教が入ってきました。" },
            { id: 9, chapter: "第一章", title: "Q1 前振り 3/4", pose: "pointing", notice: "1. キリシタン文化ってなぁ〜に？", blackboardHTML: `<div class="w-full text-left my-auto px-4"><h3 class="text-2xl sm:text-3xl chalk-yellow font-chalk border-b border-emerald-600 pb-3 mb-4">1. キリシタン文化ってなぁ〜に？</h3></div>`, speechText: "天草でもキリスト教を信じる人が多くなり、その人たちはキリシタンと呼ばれていました。" },
            { id: 10, chapter: "第一章", title: "Q1 前振り 4/4", pose: "book", notice: "1. キリシタン文化ってなぁ〜に？", blackboardHTML: `<div class="w-full text-left my-auto px-4"><h3 class="text-2xl sm:text-3xl chalk-yellow font-chalk border-b border-emerald-600 pb-3 mb-4">1. キリシタン文化ってなぁ〜に？</h3></div>`, speechText: "では、問題です。黒板に表示されるよ。" },

            // Q1 クイズ出題
            {
                id: 11, chapter: "第一章", title: "クイズ Q1", pose: "book", notice: "Q1. クイズ挑戦",
                blackboardHTML: `
                    <div class="w-full text-left my-auto px-4 space-y-3">
                        <p class="text-xs sm:text-sm chalk-text font-chalk">1. キリシタン文化ってなぁ〜に？</p>
                        <h3 class="text-base sm:text-lg chalk-yellow font-chalk mb-3">Q1. そのころ天草コレジョで印刷された本の中に、有名な西洋のお話があります。そのお話とは次のうちどれでしょう？</h3>
                        <div class="space-y-2 max-w-xs pl-4">
                            <button onclick="selectAnswer(false)" class="w-full text-left px-3 py-1.5 rounded bg-white/10 hover:bg-white/20 text-white font-chalk text-sm sm:text-base transition">① 若草物語(わかくさものがたり)</button>
                            <button onclick="selectAnswer(false)" class="w-full text-left px-3 py-1.5 rounded bg-white/10 hover:bg-white/20 text-white font-chalk text-sm sm:text-base transition">② フランダースの犬</button>
                            <button onclick="selectAnswer(true)" class="w-full text-left px-3 py-1.5 rounded bg-white/10 hover:bg-white/20 text-white font-chalk text-sm sm:text-base transition">③ イソップ物語</button>
                        </div>
                    </div>
                `,
                speechText: "わかるかな？上のせんたくしから、ひとつえらんでクリックしてね。"
            },

            // Q1 〇×判定画面
            {
                id: 12, chapter: "第一章", title: "Q1 判定", pose: "normal", notice: "Q1 判定",
                blackboardHTML: `
                    <div class="w-full text-center my-auto px-4">
                        <p class="text-sm sm:text-base chalk-text font-chalk mb-2">1. キリシタン文化ってなぁ〜に？</p>
                        <h3 class="text-lg sm:text-xl chalk-yellow font-chalk mb-4">Q1. そのころ天草コレジョで印刷された本の中に...</h3>
                        <div id="q1-result-mark" class="text-6xl sm:text-7xl font-bold my-2"></div>
                        <div id="q1-result-text" class="text-xl sm:text-2xl font-chalk"></div>
                    </div>
                `,
                speechText: "正解は3番の「イソップ物語」でした。"
            },

            // Q1 解説 & 資料写真
            {
                id: 13, chapter: "第一章", title: "Q1 解説", pose: "greeting", notice: "Q1 解説",
                blackboardHTML: `
                    <div class="w-full text-left my-auto px-2 space-y-3">
                        <h3 class="text-xl sm:text-2xl chalk-yellow font-chalk border-b border-emerald-600 pb-2">1. キリシタン文化ってなぁ〜に？ 【解説】</h3>
                        <p class="text-sm sm:text-base chalk-text font-chalk leading-relaxed">天草コレジョで印刷された<span class="chalk-yellow font-bold">「イソップ物語（伊曽保物語）」</span>は、日本初の西洋式活字印刷機を使って日本語（ローマ字や和文）に翻訳・出版された歴史的価値の高い本です。</p>
                    </div>
                `,
                speechText: "第一章のQ1解説です。活字印刷機で多くの本が出版されました。"
            },
            {
                id: 14, chapter: "第一章", title: "Q1 資料写真", pose: "pointing", notice: "資料：天草コレジヨ館",
                blackboardHTML: `

        // --- 1. 変数制御と状態管理 ---
        let currentIndex = 0;
        let score = 0;
        let hasAnswered = false;
        lastSelectedCorrect = false;
        const totalQuestions = 21;

        // 選択肢をクリックしたとき
        function selectAnswer(isCorrect) {
            hasAnswered = true;
            // 確実に boolean 値に変換
            lastSelectedCorrect = (isCorrect === true || isCorrect === 'true');
            
            if (lastSelectedCorrect) {
                score++;
            }

            if (currentIndex < slidesData.length - 1) {
                currentIndex++;
                renderSlide(currentIndex);
            }
        }

        function checkAnswer(selected, correct, nextSlideId) {
            // 1. スライドを移動する処理（既存の処理）
            goToSlide(nextSlideId);

            // 少しだけ遅延させて描画後のDOMを取得・書き換え
            setTimeout(() => {
                // 対象の表示領域を取得（Q20の場合）
                const markEl = document.getElementById(`q${currentQuestionNo}-result-mark`);
                const textEl = document.getElementById(`q${currentQuestionNo}-result-text`);

                if (markEl && textEl) {
                    // 一度中身を空にしてから〇✕を入れる
                    markEl.innerHTML = "";
                    textEl.innerHTML = "";

                    if (selected === correct) {
                        markEl.innerHTML = `<div class="text-5xl font-bold text-red-500 mb-2">〇</div>`;
                        textEl.innerHTML = `<div class="text-xl font-chalk text-red-400">せいかい！</div>`;
                    } else {
                        markEl.innerHTML = `<div class="text-5xl font-bold text-blue-500 mb-2">✕</div>`;
                        textEl.innerHTML = `<div class="text-xl font-chalk text-blue-400">ざんねん！</div>`;
                    }
                }
            }, 50);
        }

        function handleAnswer(isCorrect) {
            selectAnswer(isCorrect);
        }

        // 「次へ進む」ボタンを押したとき
        function nextSlide() {
            if (currentIndex < slidesData.length - 1) {
                // ボタンを押さずに「次へ進む」で移動した場合は不正解扱いにリセット
                lastSelectedCorrect = false;

                currentIndex++;
                renderSlide(currentIndex);
            } else {
                // 最初に戻る時
                currentIndex = 0;
                score = 0;
                hasAnswered = false;
                lastSelectedCorrect = false;
                renderSlide(currentIndex);
            }
        }

        function prevSlide() {
            if (currentIndex > 0) {
                currentIndex--;
                renderSlide(currentIndex);
            }
        }

        // --- 4. メイン描画処理（元のHTMLのID構造をそのまま使用） ---
        function renderSlide(index) {
            if (typeof slidesData === 'undefined' || !slidesData[index]) return;
            const data = slidesData[index];

            // 安全にDOM要素を更新
            const noticeEl = document.getElementById("chalkNotice");
            if (noticeEl) noticeEl.innerText = data.notice || "歴史解説";

            const blackboardEl = document.getElementById("blackboardContent");
            if (blackboardEl) blackboardEl.innerHTML = data.blackboardHTML || "";

            const narrationEl = document.getElementById("narrationText");
            if (narrationEl) narrationEl.innerText = data.speechText || "";

            // 侍SVGの更新
            let currentPose = data.pose;
            if (isResultSlide(data.id)) {
                currentPose = lastSelectedCorrect ? "happy" : "sad";
            }
            const avatarEl = document.getElementById("samuraiAvatar");
            if (avatarEl && typeof getSamuraiSVG === 'function') {
                avatarEl.innerHTML = getSamuraiSVG(currentPose);
            }

            // ★ ここが重要：判定スライドの場合、黒板の中に元々書いてある「〇」や「せいかい！」を判定結果で強制上書きする
            updateResultForSlide(data.id);

            // 最終集計スライド
            if (data.id === 118 || data.type === "final-result") {
                renderResultSlide();
            }

            // ボタン制御
            const prevBtn = document.getElementById("prevBtn");
            if (prevBtn) prevBtn.disabled = (index === 0);

            const nextBtn = document.getElementById("nextBtn");
            if (nextBtn) {
                if (index === slidesData.length - 1) {
                    nextBtn.innerHTML = `<span>最初に戻る</span> <i class="fa-solid fa-rotate-right"></i>`;
                } else {
                    nextBtn.innerHTML = `<span>次へ進む</span> <i class="fa-solid fa-chevron-right"></i>`;
                }
            }
        }

        // --- 5. 判定・〇×描画処理 ---
        function isResultSlide(id) {
            const resultIds = [12, 16, 21, 30, 32, 39, 46, 48, 50, 59, 61, 69, 75, 77, 83, 89, 90, 93, 102, 104, 112];
            return resultIds.includes(id);
        }

        // 〇×表示の割り当て関数（Q11を含む各IDとHTML要素のIDを完全に一致させる）
        function updateResultForSlide(slideId) {
            const resultMap = {
                12: ["q1-result-mark", "q1-result-text"],
                16: ["q2-result-mark", "q2-result-text"],
                21: ["q3-result-mark", "q3-result-text"],
                30: ["q4-result-mark", "q4-result-text"],
                32: ["q5-result-mark", "q5-result-text"],
                39: ["q6-result-mark", "q6-result-text"],
                46: ["q7-result-mark", "q7-result-text"],
                48: ["q8-result-mark", "q8-result-text"],
                50: ["q9-result-mark", "q9-result-text"],
                59: ["q10-result-mark", "q10-result-text"],
                61: ["q11-result-mark", "q11-result-text"],
                69: ["q12-result-mark", "q12-result-text"],
                75: ["q13-result-mark", "q13-result-text"],
                77: ["q14-result-mark", "q14-result-text"],
                83: ["q15-result-mark", "q15-result-text"],
                89: ["q16-result-mark", "q16-result-text"],
                91: ["q17-result-mark", "q17-result-text"],
                93: ["q18-result-mark", "q18-result-text"],
                102: ["q19-result-mark", "q19-result-text"],
                104: ["q20-result-mark", "q20-result-text"],
                112: ["q21-result-mark", "q21-result-text"]
            };

            if (resultMap[slideId]) {
                const [markId, textId] = resultMap[slideId];
                updateResultDOM(markId, textId);
            }
        }

        function updateResultDOM(markId, textId) {
            // ★重要：現在のスライドが「判定画面」でない場合は何もしないで終了する
            const currentSlide = slidesData[currentIndex];
            if (!currentSlide || currentSlide.type === "quiz" || currentSlide.notice === "問題") {
                return;
            }

            const markEl = document.getElementById(markId);
            const textEl = document.getElementById(textId);

            if (markEl && textEl) {
                if (lastSelectedCorrect) {
                    markEl.className = "text-6xl sm:text-7xl font-bold my-2 text-red-400";
                    markEl.innerText = "〇";
                    textEl.className = "text-xl sm:text-2xl font-chalk text-red-400";
                    textEl.innerText = "せいかい！";
                } else {
                    markEl.className = "text-6xl sm:text-7xl font-bold my-2 text-cyan-400";
                    markEl.innerText = "✕";
                    textEl.className = "text-xl sm:text-2xl font-chalk text-cyan-400";
                    textEl.innerText = "ざんねん！";
                }
            }
        }

        // --- 6. 最終判定結果 ---
        function renderResultSlide() {
            const countEl = document.getElementById('correct-count');
            if (countEl) countEl.textContent = score;

            let message = "";
            if (score === totalQuestions) {
                message = "全問正解！素晴らしい！";
            } else if (score >= 15) {
                message = "たいへんよくできました！";
            } else if (score >= 10) {
                message = "よくがんばったね！";
            } else {
                message = "次は満点をめざそう！";
            }

            const evalEl = document.getElementById('result-eval-message');
            if (evalEl) evalEl.textContent = message;
        }

        // 初期描画
        window.addEventListener("DOMContentLoaded", () => {
            renderSlide(currentIndex);
        });
    </script>
